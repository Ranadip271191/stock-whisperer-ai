# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated NSE symbols for the overnight report; leave empty to use src/nse_top60_index_symbols.csv"
        required: false
        default: ""
  schedule:
    # 01:07 UTC = 06:37 IST. GitHub drops/delays scheduled runs at congested
    # minutes (:00, :30), so this sits off-peak with ~2h of slack for the run
    # itself (60 symbols x 30-90s) to finish before NSE pre-open at 09:00 IST.
    - cron: "7 1 * * 1-5"
    # TEMPORARY one-off (05:45 UTC on 30 Oct only) to confirm cron fires at all.
    # Pinned to a single date so it can't repeat; premarket-overnight ignores it.
    - cron: "45 5 30 10 *"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # Exit code 5 = "no tests collected" - not a real failure, since this
        # repo has no test suite yet. The `|| code=$?` form is required because
        # this shell runs with `set -e`, which would otherwise abort on pytest's
        # own non-zero exit before the code is even captured.
        pytest || code=$?
        code=${code:-0}
        if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
          exit "$code"
        fi

  premarket-overnight:
    # Manual/scheduled only - skipped on every push/PR since each run makes real
    # LLM calls (cost + ~30-90s per symbol) via the configured OPENAI/ANTHROPIC key.
    # Matching the cron string excludes the throwaway test schedule from spending tokens.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '7 1 * * 1-5')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Load default symbols from CSV
        id: load_symbols
        run: |
          # Top-60 NIFTY50/100 symbols, tradingsymbol is column 1; used as the
          # default watchlist when no manual `symbols` input is given.
          SYMS=$(tail -n +2 src/nse_top60_index_symbols.csv | cut -d, -f1 | tr '\n' ' ' | sed 's/ *$//')
          echo "symbols=$SYMS" >> "$GITHUB_OUTPUT"
      - name: Run overnight pre-market report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_CHAT_MODEL_ID: ${{ vars.OPENAI_CHAT_MODEL_ID }}
          ANTHROPIC_MODEL_ID: ${{ vars.ANTHROPIC_MODEL_ID }}
          # KITE_ACCESS_TOKEN expires every trading day and is issued via an
          # interactive browser login (kite/login.py) - it can't be refreshed by
          # this workflow. Without a same-day token here, get_derivatives_snapshot
          # just reports "available: false" and the report still completes.
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          PYTHONPATH: src
          SYMBOLS: ${{ github.event.inputs.symbols || steps.load_symbols.outputs.symbols }}
        run: |
          mkdir -p reports
          python -m stock_agents.premarket overnight $SYMBOLS --out reports/overnight_$(date +%Y%m%d).md
      - name: Upload overnight report artifact
        uses: actions/upload-artifact@v4
        with:
          name: premarket-overnight-report
          path: |
            reports/overnight_*.md
            reports/.premarket_latest.json
          if-no-files-found: error

